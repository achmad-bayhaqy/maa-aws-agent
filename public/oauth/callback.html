<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAA — Koneksi OAuth</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #faf7f5; color: #1c1c1e;
  }
  .card {
    max-width: 460px; margin: 24px; padding: 28px 26px; border-radius: 14px;
    background: #fff; border: 1px solid #e8e2df; box-shadow: 0 8px 30px rgba(0,0,0,.06);
    text-align: center;
  }
  .logo { font-weight: 800; letter-spacing: .04em; font-size: 13px; color: #c22026; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; line-height: 1.6; color: #6b6b70; margin: 0 0 6px; word-break: break-word; }
  .ok { color: #157347; font-weight: 600; }
  .bad { color: #c22026; font-weight: 600; }
  .hint { margin-top: 14px; font-size: 11.5px; color: #9a9aa0; }
  .dot { width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .dot.ok { background: #e7f4ec; } .dot.bad { background: #fbeaea; }
  .spin { width: 22px; height: 22px; margin: 0 auto 12px; border-radius: 50%;
          border: 3px solid #eee2df; border-top-color: #c22026; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">MAA AWS AGENT</div>
    <div id="icon" class="spin"></div>
    <h1 id="title">Menyelesaikan koneksi&hellip;</h1>
    <p id="msg">Sedang memverifikasi respons dari penyedia login Anda. Jendela ini akan menutup otomatis.</p>
  </div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var code = qs.get('code');
  var state = qs.get('state');
  var err = qs.get('error_description') || qs.get('error');
  function mark(kind, icon, title, msg) {
    var i = document.getElementById('icon');
    i.className = 'dot ' + kind; i.textContent = icon;
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent = msg;
  }
  if (err) {
    mark('bad', '\u26A0', 'Login dibatalkan',
      'Penyedia login mengembalikan galat: ' + err + '. Tutup jendela ini dan coba lagi.');
    try { window.opener && window.opener.postMessage({ source: 'maa-oauth', error: err }, '*'); } catch (e) {}
    return;
  }
  if (!code || !state) {
    mark('bad', '\u26A0', 'Respons tidak lengkap',
      'Kode otorisasi/state tidak ditemukan di URL. Tutup jendela ini dan coba lagi.');
    try { window.opener && window.opener.postMessage({ source: 'maa-oauth', error: 'missing_code_or_state' }, '*'); } catch (e) {}
    return;
  }
  try {
    window.opener && window.opener.postMessage({ source: 'maa-oauth', code: code, state: state }, '*');
    mark('ok', '\u2713', 'Hampir selesai', 'Kode otorisasi diterima aplikasi. Jendela ini menutup otomatis dalam 1 detik.');
    setTimeout(function () { window.close(); }, 1000);
  } catch (e) {
    mark('bad', '\u26A0', 'Gagal mengembalikan hasil', 'Tidak dapat berkomunikasi dengan jendela aplikasi. Salin URL ini dan buka kembali konektornya.');
  }
})();
</script>
</body>
</html>
